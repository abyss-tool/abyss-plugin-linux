name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 最小权限（与主仓同款纪律）：CI 只读仓库内容即可。
permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 清单门禁：plugin.json / CHANGELOG / 补丁通道三处一致性 + v2 字段
  # （provides / capabilities / assetChannel / shizuku 唯一授权）。
  validate:
    name: 插件清单与资产门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin manifest & patch channel
        run: |
          chmod +x tools/validate_plugin.py
          python3 tools/validate_plugin.py

      - name: Validate abyss-asset-v1 manifest
        run: |
          chmod +x tools/validate_assets.py
          python3 tools/validate_assets.py

  # ── 构建 + 纯 JVM 单测（本仓不做本地编译：全部编译验证走 GitHub
  # Actions，ubuntu-latest 自带 Android SDK cmdline-tools，Gradle 8.14
  # wrapper 自动拉取发行版 —— 与主仓 Abyss-Tools 同源矩阵）。
  # release 变体经 secrets 注入签名材料；无 secrets（新仓接入期 /
  # fork PR）时降级为未签名产物 —— 编译门禁照常，发布门禁由
  # release 流水线的 apksigner 指纹校验兜底（ENG-100 §2）。
  build:
    name: Gradle Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect signing secrets
        env:
          ABYSS_KEYSTORE_B64: ${{ secrets.ABYSS_KEYSTORE_B64 }}
        run: |
          if [ -n "$ABYSS_KEYSTORE_B64" ]; then
            echo "ABYSS_SIGNING_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::未检测到签名 secrets（插件仓接入期 / fork PR）—— release 将产未签名包"
          fi

      - name: Decode release keystore (secrets)
        if: env.ABYSS_SIGNING_AVAILABLE == '1'
        env:
          ABYSS_KEYSTORE_B64: ${{ secrets.ABYSS_KEYSTORE_B64 }}
        run: |
          SIGNING_DIR="$RUNNER_TEMP/abyss-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ABYSS_KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/release.jks"
          echo "ABYSS_KEYSTORE_FILE=$SIGNING_DIR/release.jks" >> "$GITHUB_ENV"
          echo "release 签名材料已注入（未回显任何机密值）"

      - name: Assemble debug + release APK
        env:
          ABYSS_KEYSTORE_PASSWORD: ${{ secrets.ABYSS_KEYSTORE_PASSWORD }}
          ABYSS_KEY_ALIAS: ${{ secrets.ABYSS_KEY_ALIAS }}
          ABYSS_KEY_PASSWORD: ${{ secrets.ABYSS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Unit tests (纯 JVM 契约单测)
        run: ./gradlew test --stacktrace

      - name: Verify release APK signature (when signed)
        if: env.ABYSS_SIGNING_AVAILABLE == '1'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过指纹校验（发布流水线仍会强制校验）"
            exit 0
          fi
          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | grep -oP 'SHA-256 digest:\s*\K[0-9a-f]+' | head -1 | tr 'a-f' 'A-F')
          EXPECTED=$(echo "76:03:78:21:44:88:D6:20:79:78:BA:1E:37:E6:DC:82:AB:C2:DE:72:C9:F6:C6:7D:9B:44:95:15:8A:99:B7:69" | tr -d ':')
          echo "实际指纹: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::release APK 签名指纹与发布者常量不符 —— CI 兜底门禁失败（SEC-001 L2）"
            exit 1
          fi
          echo "✓ 指纹与发布者常量一致（SEC-001 三层信任链 L2 门禁）"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyss-plugin-linux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyss-plugin-linux-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
